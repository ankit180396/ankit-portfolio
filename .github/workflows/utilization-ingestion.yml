name: Utilization ingestion verification

on:
  push:
    paths:
      - "projects/healthcare-data-ingestion/**"
      - ".github/workflows/utilization-ingestion.yml"
  pull_request:
    paths:
      - "projects/healthcare-data-ingestion/**"
      - ".github/workflows/utilization-ingestion.yml"
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        working-directory: projects/healthcare-data-ingestion
        run: python -m pip install -e '.[dev]'
      - name: Test pipeline
        working-directory: projects/healthcare-data-ingestion
        run: python -m pytest -q
      - name: Check Python compilation
        working-directory: projects/healthcare-data-ingestion
        run: python -m compileall -q src tests scripts
      - name: Run deterministic local demo
        working-directory: projects/healthcare-data-ingestion
        run: python -m health_ingest.demo --rows 1000
      - name: Check source content
        working-directory: projects/healthcare-data-ingestion
        run: python scripts/check_source_safety.py
